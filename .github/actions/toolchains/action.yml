name: Toolchains
description: Install the toolchains pinned in .prototools through proto and moon.

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true

    # Installs everything in .moon/toolchains.yml; moon then puts the pinned
    # toolchain on PATH for every task it runs.
    - name: Setup toolchains
      shell: bash
      run: moon setup

    # Runners ship their own, newer default Rust. Without this, tasks built by different compilers
    # share target/ and fail with E0514.
    - name: Use the pinned Rust for every later step
      shell: bash
      run: echo "RUSTUP_TOOLCHAIN=$(grep "^rust = " .prototools | cut -d\" -f2)" >> "$GITHUB_ENV"

    - name: Show resolved tool versions
      shell: bash
      run: |
        moon --version
        cargo --version
        rustc --version
